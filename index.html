<!doctype html>
<html><head><meta charset="utf-8"><title>Flat 901: Gaussian splat (illustrative)</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:sans-serif}
  #info{position:fixed;top:10px;left:10px;color:#ccc;font-size:13px;background:#000a;padding:8px 12px;border-radius:6px;z-index:10}
</style>
</head><body>
<div id="info">Loading splat…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js';

const info = document.getElementById('info');
const viewer = new GaussianSplats3D.Viewer({
  cameraUp: [0, 1, 0],
  initialCameraPosition: [10.44, 1.5, 5.13],
  initialCameraLookAt: [10.04, 1.5, 6.93],
  sharedMemoryForWorkers: false,
  selfDrivenMode: true,
});
viewer.addSplatScene('./projected/flatB-trained.ply', { splatAlphaRemovalThreshold: 5 })
  .then(() => {
    viewer.start();
    info.textContent = 'Gaussians loaded — drag to orbit, scroll to zoom. Illustrative AI-derived visual, not the sanctioned plan. Known needle artifacts away from the trained viewpoints.';
    window.__loaded = true;
  })
  .catch((e) => {
    info.textContent = 'Failed: ' + e;
    console.error(e);
  });
</script>
</body></html>
